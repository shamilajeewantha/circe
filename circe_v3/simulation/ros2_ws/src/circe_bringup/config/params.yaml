# Central tunables for the circe rover brain (all [SIM-BOX] to calibrate).
# Camera intrinsics must match the URDF sensor (1280x720, hFOV 62.2°):
#   fx = fy ≈ (W/2)/tan(hFOV/2) = 640/tan(0.5428) ≈ 1055 ; cx=640, cy=360.

/circe_vggt_client:
  ros__parameters:
    slam_url: "http://127.0.0.1:8000"     # PLACEHOLDER — override with the SLAM laptop's real LAN IP,
                                           # e.g. slam_url:=http://192.168.1.8:8000 (verified working via
                                           # WSL mirrored networking + scoped firewall rules, see
                                           # slam_host/README.md "Networking"). DHCP can change that IP —
                                           # confirm it's still current before trusting it, don't assume
                                           # it's permanent.
    jpeg_quality: 80
    map_poll_period: 1.0
    voxel: 0.0
    max_points: 400000
    frame_id: "vggt_map"

/circe_localization:
  ros__parameters:
    scale_ema: 0.3
    frame_id: "vggt_map"

/circe_mapping:
  ros__parameters:
    # voxel_size is in RELATIVE-SCALE map units, NOT metres — VGGT-SLAM is
    # monocular (project.md §3/§5). A run's cloud measured only 0.217 x 0.042 x
    # 0.102 units across, so raising this to 0.10 collapsed the whole map into
    # ~2x0.4x1 cells (84 cloud pts -> 338 surfels) and left nothing to plan
    # against. The ~70s recompute that motivated raising it was fixed properly
    # instead, by vectorising the frontier scan and the normal PCA.
    # MUST match /circe_coverage + /circe_explore voxel_size.
    voxel_size: 0.05
    max_points: 400000
    recompute_period: 1.0
    normal_radius: 1          # PCA neighbourhood = 3x3x3 voxels (0.30 m here)
    max_occ_nbrs: 2
    max_frontier: 60000
    # RELATIVE-SCALE SAFE grid: voxel is derived from the map's own extent
    # (span/target_cells) and broadcast on /circe/voxel_size, because a fixed
    # voxel is meaningless when VGGT's scale is arbitrary per run.
    adaptive_voxel: true
    target_cells: 60        # 120 gave ~140k surfels; mapping/coverage hit ~97% CPU
    voxel_hysteresis: 0.25
    extent_pct: 2.0        # trim outliers when measuring map extent
    frame_id: "vggt_map"

/circe_coverage:
  ros__parameters:
    voxel_size: 0.05    # MUST match /circe_mapping's voxel_size (keys surfel state)
    fx: 1055.0
    fy: 1055.0
    cx: 640.0
    cy: 360.0
    width: 1280
    height: 720
    F_MIN: 6.0
    COS_INCIDENCE_MIN: 0.5
    floor_normal_cos: 0.8
    frame_id: "vggt_map"

/circe_explore:
  ros__parameters:
    H_CAM: 0.18
    d_h: 0.6
    R_CLUSTER: 0.25
    W_TURN: 0.3
    fx: 1055.0
    cx: 640.0
    cy: 360.0
    width: 1280
    height: 720
    F_MIN: 6.0
    COS_INCIDENCE_MIN: 0.5
    period: 2.0
    # gap clusters scored per tick; _adequate_count is O(#surfels) per candidate
    max_clusters: 40
    voxel_size: 0.05    # MUST match /circe_mapping (footprint gate uses it)
    frame_id: "vggt_map"

/circe_driver:
  ros__parameters:
    kp_ang: 1.5
    kp_lin: 0.6
    max_ang: 0.8
    max_lin: 0.25
    yaw_tol: 0.05
    pos_tol: 0.10
    tof_stop: 0.35
    cam_forward: 0.18
    cam_height: 0.18
    ring_steps: 8
    settle_ticks: 10
    # cold-start: arc until the first surfels exist, then explore takes over
    boot_lin: 0.18
    boot_ang: 0.25
    boot_ang_blocked: 0.6   # turn in place when ToF-blocked during bootstrap
    stuck_secs: 6.0
    unstick_secs: 1.5
    stuck_pos_eps: 0.01
    stuck_yaw_eps: 0.02
    frame_id: "vggt_map"
