# VGGT-SLAM host conda env (this laptop / off-board SLAM box).
# Verified working in the WSL `vggt` env: Python 3.11.15, torch 2.3.1+cu121,
# CUDA 12.1, RTX 4050. See requirements-lock.txt for the exact frozen versions
# and README.md for provenance + run steps.
#
# Recreate on a fresh Linux box:
#   conda env create -f environment.yml
#   conda activate vggt
#   # torch/torchvision from the cu121 index (NOT pip's default index):
#   pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cu121
#   # then VGGT-SLAM's own setup.sh installs salad + VGGT_SPARK + vggt_slam
#   #   (perception_models + sam3 are NOT needed — only for --run_os):
#   cd /path/to/VGGT-SLAM && ./setup.sh
#   # this server needs only fastapi + uvicorn + python-multipart on top (below).
name: vggt
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # SLAM core (pinned — see requirements-lock.txt for the full set)
      - gtsam-develop==4.3a1.dev202606262021
      - viser==0.2.23
      - numpy==1.26.1
      - open3d==0.19.0
      - trimesh==4.12.2
      - opencv-python==4.11.0.86
      - einops==0.8.2
      - safetensors==0.8.0
      - huggingface_hub==0.36.2
      - pytorch-lightning==2.6.5
      - pytorch-metric-learning==2.9.0
      - omegaconf==2.3.1
      - scipy==1.16.3
      - ftfy==6.3.1
      - regex==2026.5.9
      - lz4==4.4.5
      - termcolor==3.3.0
      - tqdm==4.68.3
      # slam_server.py HTTP API
      - fastapi==0.138.1
      - uvicorn==0.49.0
      - python-multipart==0.0.32
      - requests==2.34.2
      # torch/torchvision: install separately from the cu121 index (see header)
